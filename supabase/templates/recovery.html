<!-- パスワード再設定メール。本番・staging はダッシュボードの Authentication > Email Templates に同じ内容を設定する -->
<h2>パスワードの再設定</h2>
<p>thippo のパスワード再設定のご依頼を受け付けました。</p>
<p>下のリンクから新しいパスワードを設定してください（リンクの有効期限は1時間です）。</p>
<p>
  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery">パスワードを再設定する</a>
</p>
<p>お心当たりのない場合は、このメールを破棄してください。</p>
